  <path d="M132 214h48l50 128h136l52-112h44"
        fill="none" stroke="#fff" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="212" cy="392" r="30" fill="#fff"/>
  <circle cx="296" cy="392" r="30" fill="#fff"/>

  <text x="256" y="292" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="74"
        fill="#3b3a4d" stroke="#fff" stroke-width="9" paint-order="stroke">Unii</text>
