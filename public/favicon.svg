<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Unii">
  <defs>
    <linearGradient id="petal" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#f2809b"/>
      <stop offset="55%" stop-color="#b8407f"/>
      <stop offset="100%" stop-color="#4b1f7a"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="256" fill="#a318e8"/>

  <!-- tulip: left petal, then the taller right petal over it -->
