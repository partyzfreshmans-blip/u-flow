<script>
/* CoreJs — session, server calls, and the login screen.
   No framework on purpose: this has to parse and run fast on a mid-range
   phone over 4G, and stay readable for whoever maintains it next. */

var App = {
  token: null,
  role: null,          // 'driver' | 'admin'
  driver: null,
  dateKey: null,
  today: null,
  refreshSeconds: 20,
  day: null,
  myPos: null,
  sortByDistance: false,
};

var STORE_KEY = 'unii.routes.session.v1';

/* ---------- server calls ---------- */

/** google.script.run wrapped in a promise, with the { ok, data, error }
   envelope unwrapped. A rejected promise always carries a message that can be
   shown to a driver as-is. */
function call(fnName) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.ok) resolve(res.data);
        else reject(new Error(res && res.error ? res.error : 'เกิดข้อผิดพลาดที่เซิร์ฟเวอร์'));
      })
      .withFailureHandler(function (err) {
        reject(new Error(err && err.message ? err.message : 'ต่อเซิร์ฟเวอร์ไม่ได้ — เช็คสัญญาณแล้วลองใหม่'));
      })[fnName].apply(null, args);
  });
}

/** A session that the server has stopped honouring (driver deactivated, token
   expired) must send the user back to the login screen rather than leaving
   them staring at a stale map. */
function handleError(err) {
  var message = err && err.message ? err.message : String(err);
  if (/เข้าสู่ระบบ|ปิดใช้งาน|หมดเวลา/.test(message)) {
    clearSession();
    showScreen('screenLogin');
  }
  toast(message, true);
}

/* ---------- storage ---------- */

function saveSession() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ token: App.token, role: App.role, driver: App.driver }));
  } catch (e) { /* private mode — the session just won't survive a reload */ }
}

function loadSession() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function clearSession() {
  App.token = null; App.role = null; App.driver = null; App.day = null;
  stopAutoRefresh();
  try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
}

/* ---------- small helpers ---------- */

function $(id) { return document.getElementById(id); }

function el(tag, className, text) {
  var node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}

function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

function showScreen(id) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) screens[i].classList.toggle('active', screens[i].id === id);
}

var toastTimer = null;
function toast(message, isError) {
  var existing = document.querySelector('.toast');
  if (existing) existing.parentNode.removeChild(existing);
  var node = el('div', 'toast' + (isError ? ' error' : ''), message);
  document.body.appendChild(node);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () {
    if (node.parentNode) node.parentNode.removeChild(node);
  }, isError ? 5000 : 2600);
}

function baht(n) {
  return Number(n || 0).toLocaleString('th-TH', { maximumFractionDigits: 0 });
}

/** Date maths on 'yyyy-mm-dd' strings, anchored to the spreadsheet's today
   rather than the phone's clock. */
function addDays(dateKey, days) {
  var parts = dateKey.split('-');
  var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  d.setDate(d.getDate() + days);
  var m = d.getMonth() + 1;
  var day = d.getDate();
  return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
}

function thaiDate(dateKey) {
  var parts = dateKey.split('-');
  var months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  return Number(parts[2]) + ' ' + months[Number(parts[1]) - 1] + ' ' + (Number(parts[0]) + 543);
}

/* ---------- login ---------- */

var pinBuffer = '';
var pinTarget = null; // driverId, or 'admin'

function boot() {
  call('api_bootstrap').then(function (data) {
    App.today = data.today;
    App.dateKey = data.today;
    App.refreshSeconds = data.refreshSeconds || 20;
    renderDriverGrid(data.drivers);

    var saved = loadSession();
    if (saved && saved.token) {
      App.token = saved.token;
      App.role = saved.role;
      App.driver = saved.driver;
      if (App.role === 'admin') openAdmin();
      else openDriver();
    }
  }).catch(handleError);
}

function renderDriverGrid(drivers) {
  var grid = $('driverGrid');
  clear(grid);
  $('noDrivers').classList.toggle('hidden', drivers.length > 0);
  drivers.forEach(function (d) {
    var chip = el('button', 'driver-chip', d.displayName);
    chip.onclick = function () { startPin(d.driverId, d.displayName); };
    grid.appendChild(chip);
  });
}

function startPin(target, label) {
  pinTarget = target;
  pinBuffer = '';
  $('pinFor').textContent = label;
  $('pinError').classList.add('hidden');
  $('loginStep1').classList.add('hidden');
  $('loginStep2').classList.remove('hidden');
  renderPinDots();
}

function renderPinDots() {
  var wrap = $('pinDots');
  clear(wrap);
  for (var i = 0; i < 4; i++) {
    wrap.appendChild(el('div', 'pin-dot' + (i < pinBuffer.length ? ' filled' : '')));
  }
}

function buildKeypad() {
  var pad = $('keypad');
  clear(pad);
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', ''].forEach(function (key) {
    if (key === '') { pad.appendChild(el('div')); return; }
    var button = el('button', null, key);
    button.onclick = function () { pressKey(key); };
    pad.appendChild(button);
  });
}

function pressKey(key) {
  if (key === '⌫') pinBuffer = pinBuffer.slice(0, -1);
  else if (pinBuffer.length < 4) pinBuffer += key;
  renderPinDots();
  if (pinBuffer.length === 4) submitPin();
}

function submitPin() {
  var pin = pinBuffer;
  pinBuffer = '';
  renderPinDots();
  $('pinError').classList.add('hidden');

  var request = pinTarget === 'admin' ? call('api_adminLogin', pin) : call('api_driverLogin', pinTarget, pin);
  request.then(function (data) {
    App.token = data.token;
    App.role = pinTarget === 'admin' ? 'admin' : 'driver';
    App.driver = data.driver || null;
    saveSession();
    if (App.role === 'admin') openAdmin();
    else openDriver();
  }).catch(function (err) {
    var box = $('pinError');
    box.textContent = err.message;
    box.classList.remove('hidden');
  });
}

function backToDrivers() {
  pinBuffer = '';
  $('loginStep2').classList.add('hidden');
  $('loginStep1').classList.remove('hidden');
}

document.addEventListener('DOMContentLoaded', function () {
  buildKeypad();
  $('btnBackToDrivers').onclick = backToDrivers;
  $('btnAdminMode').onclick = function () { startPin('admin', 'แอดมิน'); };
  boot();
});
</script>
