<script>
/* DriverJs — the map screen a driver actually uses.

   One pin per stop, coloured by state, and a list showing exactly the same
   colours so the two never disagree. Stops outside the driver's zones are
   drawn small and faded and can't be opened: tapping one only says whose
   zone it is. */

var map = null;
var stopLayer = null;
var meMarker = null;
var refreshTimer = null;

function openDriver() {
  showScreen('screenDriver');
  ensureMap();
  bindDriverControls();
  $('datePick').value = App.dateKey;
  markActiveDateButton();
  loadDay();
  startAutoRefresh();
}

function ensureMap() {
  if (map) { setTimeout(function () { map.invalidateSize(); }, 60); return; }
  map = L.map('map', { zoomControl: false, attributionControl: true }).setView([18.56, 99.04], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap',
  }).addTo(map);
  L.control.zoom({ position: 'topleft' }).addTo(map);
  stopLayer = L.layerGroup().addTo(map);
  setTimeout(function () { map.invalidateSize(); }, 60);
}

var driverControlsBound = false;
function bindDriverControls() {
  if (driverControlsBound) return;
  driverControlsBound = true;

  $('btnToday').onclick = function () { setDate(App.today); };
  $('btnTomorrow').onclick = function () { setDate(addDays(App.today, 1)); };
  $('datePick').onchange = function (e) { if (e.target.value) setDate(e.target.value); };
  $('btnRefresh').onclick = function () { loadDay(true); };
  $('btnLocate').onclick = locateMe;
  $('sheetHandle').onclick = function () { $('sheet').classList.toggle('open'); };
  $('btnSortDistance').onclick = function (e) {
    e.stopPropagation();
    if (!App.myPos) { locateMe(true); return; }
    App.sortByDistance = !App.sortByDistance;
    renderStopList();
  };
}

function setDate(dateKey) {
  App.dateKey = dateKey;
  $('datePick').value = dateKey;
  markActiveDateButton();
  loadDay();
}

function markActiveDateButton() {
  $('btnToday').classList.toggle('on', App.dateKey === App.today);
  $('btnTomorrow').classList.toggle('on', App.dateKey === addDays(App.today, 1));
}

/* ---------- loading ---------- */

var loading = false;
function loadDay(manual) {
  if (loading) return;
  loading = true;
  if (manual) $('btnRefresh').textContent = '…';
  call('api_driverDay', App.token, App.dateKey).then(function (day) {
    App.day = day;
    App.refreshSeconds = day.refreshSeconds || App.refreshSeconds;
    renderSummary();
    renderStops();
    if (manual) toast('อัปเดตแล้ว');
  }).catch(handleError).then(function () {
    loading = false;
    $('btnRefresh').textContent = '↻';
  });
}

function startAutoRefresh() {
  stopAutoRefresh();
  refreshTimer = setInterval(function () {
    // Refreshing a backgrounded tab burns battery and quota for nothing.
    if (document.hidden || App.role !== 'driver') return;
    loadDay();
  }, Math.max(10, App.refreshSeconds) * 1000);
}

function stopAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = null;
}

document.addEventListener('visibilitychange', function () {
  if (!document.hidden && App.role === 'driver' && App.token) loadDay();
});

/* ---------- rendering ---------- */

function renderSummary() {
  var s = App.day.summary;
  $('sumTotal').textContent = s.mineTotal;
  $('sumClaimed').textContent = s.mineClaimed;
  $('sumDone').textContent = s.mineDone;
  $('sumAmount').textContent = baht(s.mineAmount);
}

function stopState(stop) {
  if (stop.state === 'done') return 'done';
  if (stop.state === 'failed') return 'failed';
  if (stop.state === 'claimed') return stop.mine ? 'mine' : 'taken';
  return 'available';
}

var STATE_LABEL = { available: 'ว่าง', mine: 'ฉันจองแล้ว', taken: 'มีคนจองแล้ว', done: 'ส่งแล้ว', failed: 'ส่งไม่สำเร็จ' };

function renderStops() {
  stopLayer.clearLayers();
  var bounds = [];

  if (App.day.warehouse && App.day.warehouse.lat) {
    L.marker([App.day.warehouse.lat, App.day.warehouse.lng], {
      icon: L.divIcon({ className: '', html: '<div class="pin wh"><span>คลัง</span></div>', iconSize: [34, 22], iconAnchor: [17, 11] }),
      keyboard: false,
    }).addTo(stopLayer);
  }

  App.day.otherStops.forEach(function (stop) {
    var marker = L.marker([stop.lat, stop.lng], {
      icon: L.divIcon({ className: '', html: '<div class="pin outside"></div>', iconSize: [20, 20], iconAnchor: [10, 20] }),
      zIndexOffset: -500,
    }).addTo(stopLayer);
    marker.on('click', function () {
      var owners = stop.ownerNames && stop.ownerNames.length ? stop.ownerNames.join(', ') : 'ยังไม่มีคนขับถือโซนนี้';
      toast('จุดนี้อยู่โซน ' + stop.zoneName + ' — ' + owners);
    });
  });

  App.day.stops.forEach(function (stop) {
    var state = stopState(stop);
    var label = stop.orderCount > 1 ? String(stop.orderCount) : '';
    var marker = L.marker([stop.lat, stop.lng], {
      icon: L.divIcon({
        className: '',
        html: '<div class="pin ' + state + '"><span>' + label + '</span></div>',
        iconSize: [30, 30],
        iconAnchor: [15, 30],
      }),
    }).addTo(stopLayer);
    marker.on('click', function () { openStopDetail(stop); });
    bounds.push([stop.lat, stop.lng]);
  });

  if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
  renderStopList();
}

function renderStopList() {
  var list = $('stopList');
  clear(list);
  var stops = App.day.stops.slice();

  if (App.sortByDistance && App.myPos) {
    stops.forEach(function (s) { s._d = distanceMeters(App.myPos.lat, App.myPos.lng, s.lat, s.lng); });
    stops.sort(function (a, b) { return a._d - b._d; });
  }

  $('sheetTitle').textContent = 'จุดส่ง ' + stops.length + ' จุด · ' + thaiDate(App.dateKey);
  $('btnSortDistance').textContent = App.sortByDistance ? '✓ เรียงตามระยะทาง' : 'เรียงตามระยะทาง';

  if (!stops.length) {
    list.appendChild(el('div', 'list-empty', 'ไม่มีจุดส่งในโซนของคุณสำหรับวันนี้'));
    return;
  }

  stops.forEach(function (stop) {
    var state = stopState(stop);
    var card = el('button', 'stop-card');
    var dot = el('div', 'dot');
    dot.style.background = 'var(--' + (state === 'taken' ? 'outside' : state) + ')';
    card.appendChild(dot);

    var body = el('div');
    body.style.minWidth = '0';
    body.appendChild(el('div', 'name', stop.customer || '(ไม่มีชื่อลูกค้า)'));
    var meta = stop.orderCount + ' ออเดอร์ · ' + stop.itemCount + ' รายการ';
    if (App.sortByDistance && stop._d !== undefined) meta += ' · ' + formatDistance(stop._d);
    body.appendChild(el('div', 'meta', meta));
    var badges = el('div');
    badges.style.marginTop = '4px';
    var badge = el('span', 'badge ' + (state === 'taken' ? 'flag' : state), state === 'taken' ? (stop.driverName || 'มีคนจองแล้ว') : STATE_LABEL[state]);
    badges.appendChild(badge);
    if (stop.coordSource === 'pinfix') {
      var fixed = el('span', 'badge flag', 'หมุดถูกแก้');
      fixed.style.marginLeft = '4px';
      badges.appendChild(fixed);
    }
    body.appendChild(badges);
    card.appendChild(body);

    card.appendChild(el('div', 'amount', baht(stop.amount)));
    card.onclick = function () { openStopDetail(stop); };
    list.appendChild(card);
  });

  list.appendChild(dayWrapUp(stops));
}

/** End-of-day tally at the bottom of the list: what's left, and how much cash
   the driver should be carrying. Same numbers the manager sees, so a handover
   at the warehouse doesn't need a phone call to reconcile. */
function dayWrapUp(stops) {
  var done = 0;
  var failed = 0;
  var remaining = 0;
  var collected = 0;
  stops.forEach(function (stop) {
    var state = stopState(stop);
    if (state === 'done') { done++; collected += stop.amount; }
    else if (state === 'failed') failed++;
    else if (state === 'mine' || state === 'available') remaining++;
  });

  var panel = el('div', 'panel');
  panel.style.marginTop = '4px';
  panel.appendChild(el('h3', null, 'สรุปวันนี้'));
  var stats = el('div', 'summary');
  stats.appendChild(statBox(done, 'ส่งแล้ว'));
  stats.appendChild(statBox(failed, 'ไม่สำเร็จ'));
  stats.appendChild(statBox(remaining, 'เหลือ'));
  stats.appendChild(statBox(baht(collected), 'เก็บเงินได้'));
  panel.appendChild(stats);
  return panel;
}

/* ---------- stop detail ---------- */

function openStopDetail(stop) {
  var state = stopState(stop);
  var back = el('div', 'modal-back');
  var modal = el('div', 'modal');

  modal.appendChild(el('h2', null, stop.customer || '(ไม่มีชื่อลูกค้า)'));
  var sub = el('div', 'muted small', 'โซน ' + (stop.zoneName || stop.zoneId) + (stop.zoneLocked ? ' (ล็อกไว้ตอนจอง)' : ''));
  modal.appendChild(sub);

  var badgeRow = el('div', 'section');
  badgeRow.appendChild(el('span', 'badge ' + (state === 'taken' ? 'flag' : state), state === 'taken' ? ('จองโดย ' + (stop.driverName || '—')) : STATE_LABEL[state]));
  modal.appendChild(badgeRow);

  var stats = el('div', 'summary section');
  stats.appendChild(statBox(stop.orderCount, 'ออเดอร์'));
  stats.appendChild(statBox(stop.itemCount, 'รายการ'));
  stats.appendChild(statBox(baht(stop.amount), 'ยอดเก็บ (บาท)'));
  modal.appendChild(stats);

  if (stop.address || stop.subdistrict) {
    var addr = el('div', 'section');
    addr.appendChild(el('div', 'small muted', 'ที่อยู่ (ข้อมูลอ้างอิง ไม่ใช้ตัดสินโซน)'));
    addr.appendChild(el('div', null, stop.address || stop.subdistrict));
    modal.appendChild(addr);
  }

  var orders = el('div', 'section');
  orders.appendChild(el('div', 'small muted', 'ออเดอร์ในจุดนี้'));
  stop.orders.forEach(function (order) {
    var line = el('div', 'order-line');
    var left = el('div');
    left.appendChild(el('div', null, order.orderNo));
    left.appendChild(el('div', 'small muted', (order.itemCount || 0) + ' รายการ · ' + (order.payment || '—')));
    line.appendChild(left);
    var right = el('div', 'amount');
    right.style.marginLeft = 'auto';
    right.textContent = baht(order.amount);
    line.appendChild(right);
    orders.appendChild(line);
  });
  modal.appendChild(orders);

  // Primary action first and full width: the one thing the driver came here
  // to press should be under the thumb without aiming.
  var primary = el('div', 'section');
  if (state === 'available') {
    var claimButton = el('button', 'btn-lg', 'จองจุดนี้');
    claimButton.onclick = function () { closeModal(back); claimStop(stop); };
    primary.appendChild(claimButton);
    if (stop.crossZone) primary.appendChild(el('div', 'small muted center', 'แอดมินเปิดให้จองข้ามโซนได้'));
  } else if (state === 'mine') {
    var finishButton = el('button', 'btn-lg btn-done', 'ปิดงาน');
    finishButton.onclick = function () { closeModal(back); openCompleteSheet(stop); };
    primary.appendChild(finishButton);
    var releaseButton = el('button', 'btn-ghost btn-lg', 'ปล่อยคืน');
    releaseButton.style.marginTop = '8px';
    releaseButton.onclick = function () { closeModal(back); releaseStop(stop); };
    primary.appendChild(releaseButton);
  } else if (state === 'taken') {
    primary.appendChild(el('div', 'banner warn', (stop.driverName || 'คนขับอีกคน') + ' จองจุดนี้ไปแล้ว'));
  } else if (state === 'done') {
    primary.appendChild(el('div', 'banner', 'ส่งเรียบร้อยแล้ว'));
  } else if (state === 'failed') {
    var reason = '';
    stop.orders.forEach(function (order) { if (!reason && order.failReason) reason = order.failReason; });
    primary.appendChild(el('div', 'banner danger', 'ส่งไม่สำเร็จ' + (reason ? ' — ' + reason : '')));
  }
  modal.appendChild(primary);

  var actions = el('div', 'section btn-row');
  var navButton = el('button', 'btn-lg btn-quiet', 'นำทาง');
  navButton.onclick = function () {
    window.open('https://www.google.com/maps/dir/?api=1&destination=' + stop.lat + ',' + stop.lng, '_blank');
  };
  actions.appendChild(navButton);
  if (stop.phoneDial) {
    var callButton = el('button', 'btn-lg btn-quiet', 'โทร');
    callButton.onclick = function () { window.open('tel:' + stop.phoneDial, '_self'); };
    actions.appendChild(callButton);
  }
  modal.appendChild(actions);

  if (stop.phone) {
    var fixButton = el('button', 'btn-ghost btn-lg', '📍 หมุดผิด — ใช้ตำแหน่งฉันตอนนี้');
    fixButton.style.marginTop = '8px';
    fixButton.onclick = function () { closeModal(back); fixPinHere(stop); };
    modal.appendChild(fixButton);
    modal.appendChild(el('div', 'small muted center', 'ยืนหน้าร้านแล้วกด — แก้ครั้งเดียวมีผลกับออเดอร์ของร้านนี้ตลอดไป'));
  }

  var close = el('button', 'btn-ghost btn-lg', 'ปิด');
  close.style.marginTop = '10px';
  close.onclick = function () { closeModal(back); };
  modal.appendChild(close);

  back.appendChild(modal);
  back.onclick = function (e) { if (e.target === back) closeModal(back); };
  document.body.appendChild(back);
}

function closeModal(back) {
  if (back && back.parentNode) back.parentNode.removeChild(back);
}

/* ---------- claim / release ---------- */

/** Optimistic: the pin turns dark the instant it's tapped, because waiting a
   second on 4G to find out whether a tap registered is what makes drivers tap
   twice. If the server says someone else got there first, the change is
   rolled back and the day reloaded so the map shows the truth. */
function claimStop(stop) {
  var before = { state: stop.state, mine: stop.mine, driverName: stop.driverName };
  stop.state = 'claimed';
  stop.mine = true;
  stop.driverName = App.driver.displayName;
  renderStops();
  renderSummaryOptimistic(1);

  call('api_driverClaim', App.token, App.dateKey, stop.stopKey).then(function (result) {
    toast(result.alreadyMine ? 'จุดนี้เป็นของคุณอยู่แล้ว' : 'จองแล้ว — ' + (stop.customer || 'จุดส่ง'));
    loadDay();
  }).catch(function (err) {
    stop.state = before.state;
    stop.mine = before.mine;
    stop.driverName = before.driverName;
    renderStops();
    toast(err.message, true);
    loadDay();
  });
}

function releaseStop(stop) {
  if (!window.confirm('ปล่อยจุดนี้คืนให้คนอื่นหยิบต่อ?')) return;
  var before = { state: stop.state, mine: stop.mine, driverName: stop.driverName };
  stop.state = 'available';
  stop.mine = false;
  stop.driverName = '';
  renderStops();

  call('api_driverRelease', App.token, App.dateKey, stop.stopKey).then(function () {
    toast('ปล่อยคืนแล้ว');
    loadDay();
  }).catch(function (err) {
    stop.state = before.state;
    stop.mine = before.mine;
    stop.driverName = before.driverName;
    renderStops();
    toast(err.message, true);
    loadDay();
  });
}

/** Keeps the counters honest between an optimistic change and the next load. */
function renderSummaryOptimistic(claimDelta) {
  App.day.summary.mineClaimed = Math.max(0, App.day.summary.mineClaimed + claimDelta);
  renderSummary();
}

/* ---------- closing the job ---------- */

function openCompleteSheet(stop) {
  var back = el('div', 'modal-back');
  var modal = el('div', 'modal');
  modal.appendChild(el('h2', null, 'ปิดงาน'));
  modal.appendChild(el('div', 'muted', stop.customer || 'จุดส่ง'));
  modal.appendChild(el('div', 'banner warn', 'ระบบจะเก็บตำแหน่งของคุณเฉพาะตอนกดปุ่มนี้ เพื่อยืนยันว่าไปถึงจริง — ไม่มีการติดตามต่อเนื่อง'));

  var successButton = el('button', 'btn-lg btn-done', '✓ ส่งสำเร็จ · เก็บ ' + baht(stop.amount) + ' บาท');
  successButton.style.minHeight = '64px';
  successButton.onclick = function () { closeModal(back); submitCompletion(stop, 'done', '', ''); };
  modal.appendChild(successButton);

  var failButton = el('button', 'btn-lg btn-danger', '✕ ส่งไม่สำเร็จ');
  failButton.style.marginTop = '10px';
  failButton.onclick = function () { closeModal(back); openFailSheet(stop); };
  modal.appendChild(failButton);

  var close = el('button', 'btn-ghost btn-lg', 'ยกเลิก');
  close.style.marginTop = '10px';
  close.onclick = function () { closeModal(back); };
  modal.appendChild(close);

  back.appendChild(modal);
  back.onclick = function (e) { if (e.target === back) closeModal(back); };
  document.body.appendChild(back);
}

function openFailSheet(stop) {
  var back = el('div', 'modal-back');
  var modal = el('div', 'modal');
  modal.appendChild(el('h2', null, 'ส่งไม่สำเร็จเพราะ'));

  var chosen = null;
  var noteField = el('input');
  noteField.type = 'text';
  noteField.placeholder = 'รายละเอียดเพิ่มเติม (ไม่บังคับ)';

  var reasons = (App.day && App.day.failReasons) || [];
  var buttons = [];
  reasons.forEach(function (reason) {
    var button = el('button', 'btn-ghost btn-lg', reason);
    button.style.marginTop = '8px';
    button.onclick = function () {
      chosen = reason;
      buttons.forEach(function (other) { other.className = other === button ? 'btn-lg' : 'btn-ghost btn-lg'; });
      submit.disabled = false;
    };
    buttons.push(button);
    modal.appendChild(button);
  });

  modal.appendChild(el('label', null, 'หมายเหตุ'));
  modal.appendChild(noteField);

  var submit = el('button', 'btn-lg btn-danger', 'บันทึกว่าส่งไม่สำเร็จ');
  submit.style.marginTop = '12px';
  submit.disabled = true;
  submit.onclick = function () {
    closeModal(back);
    submitCompletion(stop, 'failed', chosen, noteField.value);
  };
  modal.appendChild(submit);

  var close = el('button', 'btn-ghost btn-lg', 'ยกเลิก');
  close.style.marginTop = '8px';
  close.onclick = function () { closeModal(back); };
  modal.appendChild(close);

  back.appendChild(modal);
  back.onclick = function (e) { if (e.target === back) closeModal(back); };
  document.body.appendChild(back);
}

function submitCompletion(stop, outcome, failReason, note) {
  toast('กำลังบันทึกตำแหน่ง…');
  captureGps().then(function (gps) {
    return call('api_driverComplete', App.token, App.dateKey, stop.stopKey, {
      outcome: outcome,
      failReason: failReason,
      note: note,
      gps: gps,
    });
  }).then(function (result) {
    if (result.gpsFlag === 'far') {
      toast('บันทึกแล้ว — แต่ตำแหน่งห่างจากหมุด ' + formatDistance(result.distance) + ' แอดมินจะเห็นไว้ตรวจ');
    } else if (result.gpsFlag === 'denied') {
      toast('บันทึกแล้ว (ไม่ได้รับสิทธิ์ตำแหน่ง)');
    } else {
      toast(outcome === 'done' ? 'ส่งสำเร็จแล้ว' : 'บันทึกว่าส่งไม่สำเร็จแล้ว');
    }
    loadDay();
  }).catch(function (err) {
    toast(err.message, true);
    loadDay();
  });
}

/** Resolves rather than rejects on every failure path: a driver standing at
   the shop must always be able to close the job, whatever the phone's GPS
   decided to do. The outcome is recorded as a flag instead. */
function captureGps() {
  return new Promise(function (resolve) {
    if (!navigator.geolocation) { resolve({ status: 'unavailable' }); return; }
    navigator.geolocation.getCurrentPosition(function (pos) {
      resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: Math.round(pos.coords.accuracy || 0) });
    }, function (err) {
      resolve({ status: err && err.code === 1 ? 'denied' : 'unavailable' });
    }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 });
  });
}

/* ---------- fixing a wrong pin ---------- */

function fixPinHere(stop) {
  toast('กำลังหาตำแหน่งของคุณ…');
  captureGps().then(function (gps) {
    if (!gps || !gps.lat) {
      toast('ไม่ได้รับตำแหน่ง — เปิดสิทธิ์ตำแหน่งในเบราว์เซอร์แล้วลองใหม่', true);
      return null;
    }
    var away = stop.lat === null ? null : distanceMeters(stop.lat, stop.lng, gps.lat, gps.lng);
    var message = away === null
      ? 'บันทึกพิกัดร้านนี้เป็นตำแหน่งปัจจุบันของคุณ?'
      : 'ย้ายหมุดร้านนี้มาที่ตำแหน่งคุณ (ห่างจากหมุดเดิม ' + formatDistance(away) + ')?';
    if (!window.confirm(message)) return null;
    return call('api_driverFixPin', App.token, App.dateKey, stop.stopKey, gps.lat, gps.lng);
  }).then(function (saved) {
    if (!saved) return;
    toast('แก้หมุดแล้ว — ออเดอร์ของร้านนี้ครั้งต่อไปจะใช้พิกัดใหม่');
    loadDay();
  }).catch(function (err) {
    toast(err.message, true);
  });
}

function statBox(value, label) {
  var box = el('div', 'stat');
  box.appendChild(el('b', null, value));
  box.appendChild(el('span', null, label));
  return box;
}

/* ---------- my position ---------- */

/** Asked for only when the driver taps the button — never tracked in the
   background. Same rule the delivery-confirmation GPS will follow. */
function locateMe(thenSort) {
  if (!navigator.geolocation) { toast('เครื่องนี้ไม่รองรับการหาตำแหน่ง', true); return; }
  toast('กำลังหาตำแหน่ง…');
  navigator.geolocation.getCurrentPosition(function (pos) {
    App.myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    if (meMarker) map.removeLayer(meMarker);
    meMarker = L.circleMarker([App.myPos.lat, App.myPos.lng], {
      radius: 8, color: '#fff', weight: 3, fillColor: '#10256b', fillOpacity: 1,
    }).addTo(map);
    map.setView([App.myPos.lat, App.myPos.lng], 14);
    if (thenSort) { App.sortByDistance = true; }
    renderStopList();
  }, function () {
    toast('ไม่ได้รับสิทธิ์เข้าถึงตำแหน่ง — เปิดสิทธิ์ในเบราว์เซอร์แล้วลองใหม่', true);
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
}

function distanceMeters(lat1, lng1, lat2, lng2) {
  var toRad = Math.PI / 180;
  var dLat = (lat2 - lat1) * toRad;
  var dLng = (lng2 - lng1) * toRad;
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * 6371000 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function formatDistance(meters) {
  return meters < 1000 ? Math.round(meters) + ' ม.' : (meters / 1000).toFixed(1) + ' กม.';
}
</script>
