<style>
/* Built for a phone held in one hand, in direct sunlight, on a slow
   connection: high-contrast flat colours, no shadows to read through glare,
   nothing smaller than 44px that has to be tapped, and no web fonts. */

:root {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --ink: #14161d;
  --ink-soft: #5a6070;
  --line: #d9dce4;

  --available: #2f6fed;   /* ว่างในโซนฉัน */
  --mine: #10256b;        /* ฉันจองแล้ว */
  --done: #1f9d55;        /* ส่งแล้ว */
  --failed: #d93a2b;      /* ส่งไม่สำเร็จ */
  --outside: #9aa0b4;     /* นอกโซน */
  --warn-bg: #fff4d6;
  --warn-ink: #7a5300;
  --danger-bg: #ffe6e2;
  --danger-ink: #8f2418;

  --touch: 44px;
  --touch-lg: 56px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Sarabun", "Noto Sans Thai", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  overscroll-behavior: none;
}

#app { height: 100%; display: flex; flex-direction: column; }
.screen { display: none; height: 100%; flex-direction: column; min-height: 0; }
.screen.active { display: flex; }

/* ---------- shared controls ---------- */

button {
  font: inherit;
  font-weight: 700;
  border: none;
  border-radius: 12px;
  min-height: var(--touch);
  padding: 0 16px;
  background: var(--available);
  color: #fff;
  cursor: pointer;
}
button:active { filter: brightness(0.92); }
button[disabled] { opacity: 0.45; }
.btn-lg { min-height: var(--touch-lg); font-size: 18px; width: 100%; }
.btn-ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.btn-quiet { background: #e9ecf4; color: var(--ink); }
.btn-danger { background: var(--failed); }
.btn-done { background: var(--done); }
.btn-row { display: flex; gap: 8px; }
.btn-row > * { flex: 1; }

input, select {
  font: inherit;
  min-height: var(--touch);
  width: 100%;
  padding: 8px 12px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--ink);
}
label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-soft); margin: 10px 0 4px; }

.muted { color: var(--ink-soft); }
.small { font-size: 13px; }
.center { text-align: center; }
.row { display: flex; align-items: center; gap: 8px; }
.spacer { flex: 1; }
.hidden { display: none !important; }

/* ---------- login ---------- */

.login-wrap { flex: 1; overflow-y: auto; padding: 24px 20px 40px; max-width: 520px; margin: 0 auto; width: 100%; }
.login-title { font-size: 26px; font-weight: 800; margin: 8px 0 2px; }
.driver-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.driver-chip {
  min-height: var(--touch-lg);
  border-radius: 14px;
  background: var(--surface);
  border: 2px solid var(--line);
  color: var(--ink);
  font-size: 17px;
  display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 8px;
}
.driver-chip.selected { border-color: var(--available); background: #e8f0ff; color: var(--mine); }

.pin-display { display: flex; gap: 10px; justify-content: center; margin: 18px 0 12px; }
.pin-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink-soft); }
.pin-dot.filled { background: var(--mine); border-color: var(--mine); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.keypad button { min-height: 62px; font-size: 24px; background: var(--surface); color: var(--ink); border: 2px solid var(--line); }

/* ---------- driver header ---------- */

.topbar { background: var(--surface); border-bottom: 1px solid var(--line); padding: 8px 10px; flex: none; }
.datebar { display: flex; gap: 8px; align-items: center; }
.datebar button { min-height: var(--touch); padding: 0 14px; background: #e9ecf4; color: var(--ink); }
.datebar button.on { background: var(--mine); color: #fff; }
.datebar input[type=date] { min-height: var(--touch); width: auto; flex: 1; min-width: 0; }

.summary { display: flex; gap: 6px; margin-top: 8px; }
.stat { flex: 1; background: #eef1f7; border-radius: 10px; padding: 6px 8px; text-align: center; }
.stat b { display: block; font-size: 19px; line-height: 1.2; }
.stat span { font-size: 11px; color: var(--ink-soft); }

/* ---------- map + sheet ---------- */

.map-wrap { flex: 1; position: relative; min-height: 0; }
#map, #zoneMap { position: absolute; inset: 0; }
.leaflet-container { font: inherit; background: #e7e9ee; }

.map-fab {
  position: absolute; right: 12px; z-index: 500;
  width: var(--touch-lg); height: var(--touch-lg); border-radius: 50%;
  background: var(--surface); color: var(--mine); font-size: 20px;
  border: 1px solid var(--line);
}
.map-fab.locate { bottom: 148px; }
.map-fab.refresh { bottom: 84px; }

.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 600;
  background: var(--surface);
  border-radius: 18px 18px 0 0;
  border-top: 1px solid var(--line);
  display: flex; flex-direction: column;
  height: 64px;                     /* collapsed: just the handle + count */
  max-height: 78%;
  transition: height 0.18s ease-out;
}
.sheet.open { height: 62%; }
.sheet-handle { flex: none; padding: 8px 14px 6px; display: flex; align-items: center; gap: 10px; min-height: 56px; }
.sheet-grip { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto; }
.sheet-head { display: flex; align-items: center; gap: 8px; width: 100%; }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 12px 24px; }

.stop-card {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 12px; margin-bottom: 8px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 14px;
  min-height: var(--touch-lg); width: 100%; text-align: left; color: var(--ink); font-weight: 500;
}
.stop-card .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; margin-top: 5px; }
.stop-card .name { font-weight: 800; font-size: 16px; }
.stop-card .meta { font-size: 13px; color: var(--ink-soft); }
.stop-card .amount { margin-left: auto; font-weight: 800; white-space: nowrap; }

.badge { display: inline-block; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
.badge.available { background: #e3ecff; color: #14357f; }
.badge.mine { background: var(--mine); color: #fff; }
.badge.done { background: #dff3e6; color: #0f6b39; }
.badge.failed { background: var(--danger-bg); color: var(--danger-ink); }
.badge.flag { background: var(--warn-bg); color: var(--warn-ink); }

/* ---------- map markers ---------- */

.pin {
  width: 30px; height: 30px; border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  border: 2px solid #fff;
  display: flex; align-items: center; justify-content: center;
}
.pin span { transform: rotate(45deg); color: #fff; font-size: 12px; font-weight: 800; }
.pin.available { background: var(--available); }
.pin.mine { background: var(--mine); }
.pin.done { background: var(--done); }
.pin.failed { background: var(--failed); }
.pin.outside { background: var(--outside); opacity: 0.45; border-color: #eceef3; width: 20px; height: 20px; }
/* In my zone but already taken by another driver — deliberately not one of
   the five spec colours, so it can't be mistaken for one of my own stops. */
.pin.taken { background: var(--outside); }
.pin.wh { background: #14161d; border-radius: 6px; transform: none; }
.pin.wh span { transform: none; }

/* ---------- modal ---------- */

.modal-back {
  position: fixed; inset: 0; background: rgba(12, 14, 20, 0.55);
  z-index: 1000; display: flex; align-items: flex-end; justify-content: center;
}
.modal {
  background: var(--surface); width: 100%; max-width: 560px;
  border-radius: 18px 18px 0 0; padding: 16px 16px 24px;
  max-height: 88%; overflow-y: auto;
}
.modal h2 { margin: 0 0 2px; font-size: 21px; }
.modal .section { margin-top: 14px; }
.order-line { display: flex; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }

.toast {
  position: fixed; left: 12px; right: 12px; bottom: 16px; z-index: 2000;
  background: #14161d; color: #fff; padding: 14px 16px; border-radius: 12px;
  font-weight: 700; text-align: center;
}
.toast.error { background: var(--failed); }

.banner { padding: 10px 12px; border-radius: 12px; font-weight: 700; margin: 8px 0; }
.banner.warn { background: var(--warn-bg); color: var(--warn-ink); }
.banner.danger { background: var(--danger-bg); color: var(--danger-ink); }

/* ---------- admin ---------- */

.admin-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none; }
.admin-tabs button { background: #e9ecf4; color: var(--ink); white-space: nowrap; padding: 0 14px; }
.admin-tabs button.on { background: var(--mine); color: #fff; }
.admin-body { flex: 1; overflow-y: auto; padding: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
.panel h3 { margin: 0 0 8px; font-size: 16px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; }
.list-empty { color: var(--ink-soft); font-size: 14px; padding: 8px 0; }
.zone-map-wrap { position: relative; height: 60vh; min-height: 320px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 2px solid var(--line); border-radius: 999px; padding: 6px 12px; background: var(--surface); color: var(--ink); min-height: var(--touch); }
.chip.on { background: var(--mine); color: #fff; border-color: var(--mine); }

@media (min-width: 700px) {
  .driver-grid { grid-template-columns: repeat(3, 1fr); }
  .modal { border-radius: 18px; margin-bottom: 5vh; }
  .modal-back { align-items: center; }
}
</style>
